<style>
  :root{
    --navy-deep:#0B5D18;
    --navy-panel-2:#0E7A20;
    --parchment:#F5F3EA;
    --teal-sea:#0F6B76;
    --brass:#E8B923;
    --brass-text:#8A6B10;
    --coral:#D32B26;
    --success:#128C1E;
    --success-bg:#E4F3E6;
    --teal-bg:#E1EEF0;
    --brass-bg:#FBF0D2;
    --foam:#F6FAF4;
    --ink:#22281F;
    --ink-soft:#5B6560;
    --shadow: 0 8px 24px rgba(11,60,20,0.20);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans', sans-serif;
    background: var(--navy-deep);
    color: var(--foam);
    min-height:100vh;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }

  header.top{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; padding-bottom:20px; border-bottom:1px solid rgba(247,245,239,0.14); margin-bottom:22px;
  }
  .header-left{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .logo-img{ height:46px; width:auto; background:#fff; padding:6px 10px; border-radius:8px; display:block; }
  .header-text .brand-eyebrow{ margin:0 0 4px; }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--brass); margin:0 0 6px;
  }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(26px,4vw,38px); margin:0; line-height:1.05; }
  .route-sub{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:rgba(247,245,239,0.75); margin-top:8px; }
  .route-sub b{ color:var(--foam); font-weight:600;}
  button.icon-btn{
    background:transparent; border:1px solid rgba(247,245,239,0.35); color:var(--foam);
    border-radius:999px; width:38px;height:38px; font-size:16px; cursor:pointer;
    display:flex;align-items:center;justify-content:center; transition:background .15s ease, transform .15s ease;
  }
  button.icon-btn:hover{ background:rgba(247,245,239,0.12); transform: rotate(20deg);}

  nav.tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  nav.tabs button{
    font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:600; padding:10px 18px;
    border-radius:999px; border:1px solid rgba(247,245,239,0.25); background:transparent;
    color:rgba(247,245,239,0.75); cursor:pointer; transition:all .15s ease;
  }
  nav.tabs button.active{ background:var(--brass); border-color:var(--brass); color:var(--navy-deep); }
  nav.tabs button:not(.active):hover{ border-color:var(--brass); color:var(--foam); }

  .panel{
    background:var(--parchment); color:var(--ink); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px;
  }
  .panel + .panel{ margin-top:18px; }
  .panel h2{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; margin:0 0 4px; color:var(--ink); }
  .panel .desc{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; }

  .grid-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:8px; }
  label{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:6px; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:10px 12px;
    border-radius:8px; border:1px solid rgba(11,37,69,0.22); background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--teal-sea); outline-offset:1px; }

  fieldset.estado-group{
    border:1px solid rgba(11,37,69,0.18); border-radius:10px; padding:12px 14px 14px;
    margin:6px 0 16px;
  }
  fieldset.estado-group legend{
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-soft); padding:0 6px;
  }
  .check-row{ display:flex; flex-wrap:wrap; gap:18px; }
  .check-item{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); }
  .check-item input{ width:17px; height:17px; accent-color:var(--teal-sea); }

  .btn-primary{
    background:var(--navy-deep); color:var(--foam); border:none; font-weight:600; font-size:14px;
    padding:12px 22px; border-radius:8px; cursor:pointer; transition:background .15s ease;
  }
  .btn-primary:hover{ background:var(--navy-panel-2); }
  .btn-ghost{
    background:transparent; border:1px solid rgba(11,37,69,0.3); color:var(--ink);
    font-weight:600; font-size:13px; padding:9px 16px; border-radius:8px; cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--coral); color:var(--coral); }
  .btn-danger{ background:transparent; border:1px solid var(--coral); color:var(--coral); }

  /* BITACORA */
  .log-wrap{ overflow-x:auto; }
  table.log{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px; background:#fff; border-radius:10px; overflow:hidden; }
  table.log th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--foam); background:var(--navy-deep); padding:10px 12px;
  }
  table.log td{ padding:10px 12px; border-bottom:1px solid rgba(11,37,69,0.10); color:var(--ink); vertical-align:middle; }
  table.log tbody tr:nth-child(even){ background:rgba(11,37,69,0.035); }
  table.log tbody tr:hover{ background:rgba(15,91,102,0.07); }
  .socio-num{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink); }

  .filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 16px; }
  .filter-chip{
    --chip-color:#666;
    font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; font-weight:600;
    padding:6px 14px; border-radius:999px; cursor:pointer;
    background:#fff; border:1.5px solid var(--chip-color); color:var(--chip-color);
    transition:all .15s ease;
  }
  .filter-chip.active{ background:var(--chip-color); color:#fff; }
  .filter-chip:hover:not(.active){ background:color-mix(in srgb, var(--chip-color) 12%, #fff); }

  .team-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding:3px 10px 3px 8px; border-radius:999px; background:#fff; white-space:nowrap;
  }
  .team-tag .dot{ width:8px; height:8px; border-radius:50%; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; margin:1px 3px 1px 0; }
  .badge-contactado{ background:var(--teal-bg); color:var(--teal-sea); }
  .badge-acuerdo{ background:var(--brass-bg); color:var(--brass-text); }
  .badge-recuperado{ background:var(--success-bg); color:var(--success); }

  .del-btn{ background:none;border:none;color:var(--coral);cursor:pointer;font-size:14px; }

  /* MAP */
  .map-card{ background: var(--parchment); border-radius:var(--radius); position:relative; overflow:hidden; }
  .map-card svg{ display:block; width:100%; height:auto; }
  .legend-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px; }
  .team-card{ border-radius:10px; padding:14px 16px; background:#fff; border:1px solid rgba(11,37,69,0.1); border-top:5px solid var(--brass); }
  .team-card .tname{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:0 0 2px; color:var(--ink); }
  .team-card .tcapt{ font-size:12px; color:var(--ink-soft); margin:0 0 10px; }
  .team-card .pct{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; margin:0; }
  .bar-bg{ width:100%; height:7px; border-radius:99px; background:rgba(11,37,69,0.1); margin:8px 0 10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; transition:width .4s ease;}
  .mini-stats{ display:flex; gap:12px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .medal{ font-size:15px; margin-right:4px;}

  /* GERENCIA */
  .week-table-wrap{ overflow-x:auto; }
  table.week{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  table.week th{
    background:var(--navy-deep); color:var(--foam); font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; text-align:left;
  }
  table.week td{ padding:10px 12px; border-bottom:1px solid rgba(11,37,69,0.1); color:var(--ink); }
  table.week tbody tr:nth-child(even){ background:rgba(11,37,69,0.035); }
  table.week tfoot td{ font-weight:700; border-top:2px solid rgba(11,37,69,0.25); background:rgba(200,155,60,0.16); }
  .empty-note{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:14px 0; }

  /* MODAL */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(11,37,69,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--parchment); color:var(--ink); border-radius:var(--radius); max-width:560px; width:100%; max-height:86vh; overflow-y:auto; padding:26px; box-shadow:var(--shadow); }
  .modal h2{ font-family:'Fraunces',serif; margin:0 0 4px; color:var(--ink);}
  .team-edit-row{ display:grid; grid-template-columns: 20px 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px; }
  .swatch{ width:16px;height:16px;border-radius:50%; }
  .field-row{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  hr.sep{ border:none; border-top:1px solid rgba(11,37,69,0.15); margin:18px 0; }
  .modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; flex-wrap:wrap;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy-deep); color:var(--foam);
    padding:10px 18px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }
  .loading-note{ font-size:13px; color:rgba(247,245,239,0.7); padding:30px 0; }

  @media (max-width:640px){
    .panel{ padding:18px; }
    nav.tabs button{ padding:9px 13px; font-size:13px; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){

  let config = null;
  let entries = [];
  let currentTab = 'registro';
  let filtroEquipo = 'todos';
  let filtroSoloHoy = true;

  let configItemId = null;

  /* ---------- CONEXIÓN CON GOOGLE SHEETS (via Apps Script) ---------- */
  const API_URL = 'https://script.google.com/macros/s/AKfycbwBsz7tZzq8w015UaJdH5atoXhA9xdkfAaHynG7wbZ6Vytc3hA2RtlkGRlmUZW74hck/exec';
  const API_TOKEN = 'regata-junin-2026-secreto';

  async function apiCall(action, extra){
    extra = extra || {};
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: API_TOKEN, action: action }, extra))
    });
    if(!res.ok) throw new Error('Error de red (' + res.status + ')');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error desconocido');
    return data;
  }

  function siNo(bool){ return bool ? 'Sí' : 'No'; }

  function defaultConfig(){
    return {
      equipos: [
        { id:'e1', nombre:'Embarcación Halcón del Mar', capitan:'Por definir', color:'#128C1E' },
        { id:'e2', nombre:'Embarcación Sirena Veloz', capitan:'Por definir', color:'#E8B923' },
        { id:'e3', nombre:'Embarcación Tridente', capitan:'Por definir', color:'#D32B26' }
      ],
      meta: { monto:10000, acuerdos:30, recuperados:15, contactos:100 },
      fechaInicio: new Date().toISOString().slice(0,10)
    };
  }

  async function loadAll(){
    try{
      const data = await apiCall('getAll');
      if(data.config){
        config = data.config;
      } else {
        config = defaultConfig();
        await persistConfig();
      }
      if(!config.meta.recuperados && config.meta.socios){ config.meta.recuperados = config.meta.socios; }

      entries = (data.entries || []).map(row => ({
        id: row.ID,
        equipoId: row.EquipoId || '',
        fecha: row.Fecha ? String(row.Fecha).slice(0,10) : '',
        socio: row.Socio || '',
        contactado: row.Contactado === 'Sí',
        acuerdo: row.Acuerdo === 'Sí',
        recuperado: row.Recuperado === 'Sí',
        monto: Number(row.Monto) || 0,
        nota: row.Nota || '',
        registradoPor: row.RegistradoPor || '',
        ts: row.Timestamp ? new Date(row.Timestamp).getTime() : Date.now()
      }));
    }catch(e){
      console.error('Error cargando datos de Google Sheets', e);
      showToast('No se pudo conectar con la base de datos. Revisa tu conexión y recarga la página.');
      config = config || defaultConfig();
      entries = entries || [];
    }
  }

  async function persistConfig(){
    try{
      await apiCall('saveConfig', { config: config });
    }catch(e){
      console.error('Error guardando configuración', e);
      showToast('No se pudo guardar la configuración.');
    }
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString('es-EC', {maximumFractionDigits:0}); }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function diasTranscurridos(){
    if(!config.fechaInicio) return '';
    const start = new Date(config.fechaInicio+'T00:00:00');
    const now = new Date();
    const diff = Math.max(0, Math.floor((now-start)/(1000*60*60*24)));
    return 'Día ' + (diff+1) + ' de travesía';
  }

  /* ---------- CÁLCULOS ---------- */
  function totalesEquipo(equipoId){
    const es = entries.filter(e=>e.equipoId===equipoId);
    const monto = es.reduce((a,e)=> a + (Number(e.monto)||0), 0);
    const contactos = es.filter(e=>e.contactado).length;
    const casos = {};
    es.forEach(e=>{
      const key = 's:' + (e.socio||'').trim().toLowerCase();
      if(key==='s:') return;
      if(!casos[key]) casos[key] = {acuerdo:false, recuperado:false};
      if(e.acuerdo) casos[key].acuerdo = true;
      if(e.recuperado) casos[key].recuperado = true;
    });
    const acuerdos = Object.values(casos).filter(c=>c.acuerdo).length;
    const recuperados = Object.values(casos).filter(c=>c.recuperado).length;
    return { monto, contactos, acuerdos, recuperados };
  }

  function avanceEquipo(totales){
    const m = config.meta;
    const pMonto = m.monto ? Math.min(100,(totales.monto/m.monto)*100) : 0;
    const pAc = m.acuerdos ? Math.min(100,(totales.acuerdos/m.acuerdos)*100) : 0;
    const pRe = m.recuperados ? Math.min(100,(totales.recuperados/m.recuperados)*100) : 0;
    const pCo = m.contactos ? Math.min(100,(totales.contactos/m.contactos)*100) : 0;
    return Math.min(100, pMonto*0.4 + pAc*0.25 + pRe*0.25 + pCo*0.10);
  }

  function rankingEquipos(){
    return config.equipos.map(eq=>{
      const tot = totalesEquipo(eq.id);
      return { ...eq, totales:tot, avance:avanceEquipo(tot) };
    }).sort((a,b)=> b.avance - a.avance);
  }

  function getISOWeekLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const target = new Date(d.valueOf());
    const dayNr = (d.getDay()+6)%7;
    target.setDate(target.getDate()-dayNr+3);
    const firstThursday = new Date(target.getFullYear(),0,4);
    const diff = target - firstThursday;
    const week = 1 + Math.round(diff/(7*24*60*60*1000));
    return target.getFullYear()+'-S'+String(week).padStart(2,'0');
  }

  /* ---------- ROUTE GEOMETRY ---------- */
  const ROUTE = [
    {x:75,y:215},{x:235,y:150},{x:395,y:235},{x:555,y:118},{x:715,y:205},{x:865,y:92},{x:945,y:150}
  ];
  function pointAt(t){
    const segs = ROUTE.length-1;
    const scaled = Math.max(0,Math.min(1,t))*segs;
    const i = Math.min(segs-1, Math.floor(scaled));
    const lt = scaled - i;
    const p0=ROUTE[i], p1=ROUTE[i+1];
    return { x:p0.x+(p1.x-p0.x)*lt, y:p0.y+(p1.y-p0.y)*lt };
  }
  function routePathD(){ return 'M ' + ROUTE.map(p=>p.x+' '+p.y).join(' L '); }

  function boatSVG(x,y,color,pct,idx){
    const dy = (idx-1)*16;
    return `
      <g transform="translate(${x}, ${y+dy})">
        <ellipse cx="-14" cy="9" rx="16" ry="4" fill="${color}" opacity="0.18"></ellipse>
        <path d="M -12 8 Q 0 16 12 8 L 8 8 Q 0 12 -8 8 Z" fill="${color}" stroke="${color}" stroke-width="1"></path>
        <line x1="0" y1="8" x2="0" y2="-16" stroke="#5b4a2f" stroke-width="1.6"></line>
        <path d="M 0 -16 L 13 -7 L 0 0 Z" fill="${color}" opacity="0.92"></path>
        <text x="0" y="-21" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" fill="#0B2545">${Math.round(pct)}%</text>
      </g>`;
  }

  /* ---------- RENDER: GERENCIA ---------- */
  function renderGerencia(){
    const ranking = rankingEquipos();

    const weekMap = {};
    entries.forEach(e=>{
      const wk = getISOWeekLabel(e.fecha);
      if(!weekMap[wk]) weekMap[wk] = {};
      config.equipos.forEach(eq=>{ if(!weekMap[wk][eq.id]) weekMap[wk][eq.id] = {monto:0,acuerdos:0,recuperados:0,contactos:0}; });
      if(e.contactado) weekMap[wk][e.equipoId].contactos += 1;
      if(e.acuerdo) weekMap[wk][e.equipoId].acuerdos += 1;
      if(e.recuperado) weekMap[wk][e.equipoId].recuperados += 1;
      weekMap[wk][e.equipoId].monto += Number(e.monto)||0;
    });
    const weeks = Object.keys(weekMap).sort();

    let weekRows = '';
    if(weeks.length===0){
      weekRows = `<tr><td colspan="${config.equipos.length+1}" class="empty-note">Todavía no hay avances registrados esta semana.</td></tr>`;
    } else {
      weeks.forEach(wk=>{
        weekRows += `<tr>
          <td><b>${wk}</b></td>
          ${config.equipos.map(eq=>{
            const d = weekMap[wk][eq.id] || {monto:0,acuerdos:0,recuperados:0,contactos:0};
            return `<td>${fmtMoney(d.monto)} · ${d.acuerdos} acuerdos · ${d.recuperados} recup.</td>`;
          }).join('')}
        </tr>`;
      });
    }

    const orderedRanking = config.equipos.map(eq=> ranking.find(r=>r.id===eq.id));
    const totalRow = `<tr>
      <td>Total acumulado</td>
      ${orderedRanking.map(eq=>`<td>${fmtMoney(eq.totales.monto)} · ${eq.totales.acuerdos} acuerdos · ${eq.totales.recuperados} recup.</td>`).join('')}
    </tr>`;

    const barRows = ranking.map(eq=>`
      <div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span>${esc(eq.nombre)}</span><span style="font-family:'IBM Plex Mono',monospace;">${Math.round(eq.avance)}%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${eq.avance}%; background:${eq.color}"></div></div>
      </div>
    `).join('');

    return `
      <div class="panel">
        <h2>Resumen semanal · vista de gerencia y contaduría</h2>
        <p class="desc">Vista de solo lectura pensada para seguimiento agregado, sin necesidad de revisar el detalle diario.</p>
        ${barRows}
        <hr class="sep">
        <div class="week-table-wrap">
          <table class="week">
            <thead><tr><th>Semana</th>${config.equipos.map(eq=>`<th>${esc(eq.nombre)}</th>`).join('')}</tr></thead>
            <tbody>${weekRows}</tbody>
            <tfoot>${totalRow}</tfoot>
          </table>
        </div>
        <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn-ghost" id="btn-copiar-resumen">📋 Copiar resumen para compartir</button>
          <button class="btn-primary" id="btn-exportar-excel">📥 Descargar respaldo en Excel</button>
        </div>
      </div>
    `;
  }

  function exportarExcel(){
    if(typeof XLSX === 'undefined'){
      showToast('No se pudo cargar el módulo de Excel. Verifica tu conexión.');
      return;
    }
    const teamName = (id)=>{ const t = config.equipos.find(q=>q.id===id); return t ? t.nombre : id; };

    const bitacoraRows = entries.slice().sort((a,b)=> a.ts-b.ts).map(e=>({
      'Fecha': e.fecha,
      'Embarcación': teamName(e.equipoId),
      'N° de socio': e.socio || '',
      'Contactado': e.contactado ? 'Sí' : 'No',
      'Acuerdo de pago': e.acuerdo ? 'Sí' : 'No',
      'Recuperado': e.recuperado ? 'Sí' : 'No',
      'Monto recuperado': Number(e.monto)||0,
      'Registrado por': e.registradoPor || '',
      'Nota': e.nota || ''
    }));

    const ranking = rankingEquipos();
    const resumenRows = ranking.map(eq=>({
      'Embarcación': eq.nombre,
      'Capitán/a': eq.capitan,
      'Avance (%)': Math.round(eq.avance),
      'Monto recuperado': eq.totales.monto,
      'Meta de monto': config.meta.monto,
      'Acuerdos de pago': eq.totales.acuerdos,
      'Meta de acuerdos': config.meta.acuerdos,
      'Casos recuperados': eq.totales.recuperados,
      'Meta de recuperados': config.meta.recuperados,
      'Contactos efectivos': eq.totales.contactos,
      'Meta de contactos': config.meta.contactos
    }));

    const wb = XLSX.utils.book_new();
    const wsBitacora = XLSX.utils.json_to_sheet(bitacoraRows);
    const wsResumen = XLSX.utils.json_to_sheet(resumenRows);
    XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen por equipo');
    XLSX.utils.book_append_sheet(wb, wsBitacora, 'Bitácora completa');
    XLSX.writeFile(wb, `regata_recuperacion_respaldo_${todayISO()}.xlsx`);
    showToast('📥 Respaldo en Excel descargado');
  }

  function resumenTexto(){
    const ranking = rankingEquipos();
    let txt = `⚓ Regata de la Recuperación — Resumen (${todayISO()})\n\n`;
    ranking.forEach((eq,i)=>{
      txt += `${i+1}. ${eq.nombre} — ${Math.round(eq.avance)}% | ${fmtMoney(eq.totales.monto)} recuperados | ${eq.totales.acuerdos} acuerdos | ${eq.totales.recuperados} casos recuperados | ${eq.totales.contactos} contactos\n`;
    });
    return txt;
  }

  /* ---------- MAIN RENDER ---------- */
  function render(){
    renderTabsNav();
    document.getElementById('dias-transcurridos').textContent = diasTranscurridos();
    const el = document.getElementById('tab-content');
    if(currentTab==='registro') el.innerHTML = renderRegistro();
    else if(currentTab==='mapa') el.innerHTML = renderMapa();
    else el.innerHTML = renderGerencia();
    attachContentListeners();
  }

  function attachContentListeners(){
    const form = document.getElementById('form-registro');
    if(form){
      form.addEventListener('submit', async (ev)=>{
        ev.preventDefault();
        const entry = {
          equipoId: document.getElementById('f-equipo').value,
          fecha: document.getElementById('f-fecha').value,
          socio: document.getElementById('f-socio').value.trim(),
          contactado: document.getElementById('f-contactado').checked,
          acuerdo: document.getElementById('f-acuerdo').checked,
          recuperado: document.getElementById('f-recuperado').checked,
          monto: parseFloat(document.getElementById('f-monto').value)||0,
          nota: document.getElementById('f-nota').value,
          registradoPor: document.getElementById('f-nombre').value,
          ts: Date.now()
        };
        try{
          const equipo = (config.equipos || []).find(eq => eq.id === entry.equipoId);
          const result = await apiCall('create', { fields: {
            equipoId: entry.equipoId,
            equipoNombre: equipo ? equipo.nombre : entry.equipoId,
            fecha: entry.fecha,
            socio: entry.socio,
            contactado: siNo(entry.contactado),
            acuerdo: siNo(entry.acuerdo),
            recuperado: siNo(entry.recuperado),
            monto: entry.monto,
            nota: entry.nota,
            registradoPor: entry.registradoPor
          }});
          entry.id = result.id;
          entries.push(entry);
          showToast('⚓ Gestión anotada en la bitácora');
        }catch(err){
          console.error(err);
          showToast('No se pudo guardar. Intenta de nuevo.');
        }
        render();
      });
    }
    document.querySelectorAll('[data-filter-equipo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        filtroEquipo = btn.dataset.filterEquipo;
        render();
      });
    });
    const soloHoyBox = document.getElementById('f-solo-hoy');
    if(soloHoyBox){
      soloHoyBox.addEventListener('change', ()=>{
        filtroSoloHoy = soloHoyBox.checked;
        render();
      });
    }
    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.del;
        const entry = entries.find(e=>e.id===id);
        if(!entry) return;
        try{
          await apiCall('delete', { id: entry.id });
          entries = entries.filter(e=>e.id!==id);
          showToast('Registro eliminado');
        }catch(err){
          console.error(err);
          showToast('No se pudo eliminar.');
        }
        render();
      });
    });
    const copyBtn = document.getElementById('btn-copiar-resumen');
    if(copyBtn){
      copyBtn.addEventListener('click', async ()=>{
        try{ await navigator.clipboard.writeText(resumenTexto()); showToast('Resumen copiado al portapapeles'); }
        catch(e){ showToast('No se pudo copiar automáticamente'); }
      });
    }
    const exportBtn = document.getElementById('btn-exportar-excel');
    if(exportBtn){
      exportBtn.addEventListener('click', exportarExcel);
    }
  }

    backdrop.querySelector('#btn-cancel').addEventListener('click', ()=> backdrop.remove());
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });

    backdrop.querySelector('#btn-save').addEventListener('click', async ()=>{
      config.equipos.forEach(eq=>{
        const nameInput = backdrop.querySelector(`[data-team-name="${eq.id}"]`);
        const captInput = backdrop.querySelector(`[data-team-capt="${eq.id}"]`);
        if(nameInput.value.trim()) eq.nombre = nameInput.value.trim();
        eq.capitan = captInput.value.trim() || 'Por definir';
      });
      config.meta.monto = parseFloat(backdrop.querySelector('#m-monto').value)||1;
      config.meta.acuerdos = parseFloat(backdrop.querySelector('#m-acuerdos').value)||1;
      config.meta.recuperados = parseFloat(backdrop.querySelector('#m-recuperados').value)||1;
      config.meta.contactos = parseFloat(backdrop.querySelector('#m-contactos').value)||1;
      config.fechaInicio = backdrop.querySelector('#m-fecha').value || config.fechaInicio;
      await persistConfig();
      showToast('Configuración guardada');
      backdrop.remove();
      render();
    });

    backdrop.querySelector('#btn-reset').addEventListener('click', async ()=>{
      if(confirm('¿Reiniciar la regata? Esto borrará todos los registros de gestión (no se puede deshacer).')){
        try{
          await apiCall('reset');
          entries = [];
          showToast('La regata fue reiniciada');
        }catch(err){
          console.error(err);
          showToast('Hubo un error al reiniciar los registros.');
        }
        backdrop.remove();
        render();
      }
    });
  }

  /* ---------- INIT ---------- */
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    currentTab = btn.dataset.tab;
    render();
  });
  document.getElementById('btn-settings').addEventListener('click', openSettings);

  loadAll().then(render);

})();
</script>
